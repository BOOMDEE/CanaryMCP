name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      deploy_message:
        description: Optional note for this deployment
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: canary-mcp-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CanaryMCP Worker and D1
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAIRING_SECRET: ${{ secrets.CANARYMCP_PAIRING_SECRET }}
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "Missing CLOUDFLARE_API_TOKEN secret." >&2; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "Missing CLOUDFLARE_ACCOUNT_ID variable." >&2; exit 1; }
          test -n "${PAIRING_SECRET:-}" || { echo "Missing CANARYMCP_PAIRING_SECRET secret." >&2; exit 1; }
          test "${#PAIRING_SECRET}" -ge 32 || { echo "CANARYMCP_PAIRING_SECRET must contain at least 32 characters." >&2; exit 1; }
          [[ "${WEBHOOK_KEY:-}" =~ ^[A-Za-z0-9_-]{43}$ ]] || { echo "WEBHOOK_ENCRYPTION_KEY must be 32 random bytes encoded as 43 base64url characters." >&2; exit 1; }

      - name: Verify Worker and documentation
        run: npm run typecheck && npm test && npm run docs:build && npx wrangler deploy --dry-run

      - name: Ensure production D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Configure CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (repository variable)." >&2
            exit 1
          fi
          npx wrangler d1 list --json > /tmp/d1-list.json
          db_id="$(jq -r '.[] | select(.name == "canary-mcp-db") | .uuid' /tmp/d1-list.json | head -n 1)"
          if [ -z "$db_id" ]; then
            npx wrangler d1 create canary-mcp-db
            npx wrangler d1 list --json > /tmp/d1-list.json
            db_id="$(jq -r '.[] | select(.name == "canary-mcp-db") | .uuid' /tmp/d1-list.json | head -n 1)"
          fi
          if [ -z "$db_id" ] || [ "$db_id" = "null" ]; then
            echo "Could not determine the canary-mcp-db database ID." >&2
            exit 1
          fi
          jq --arg id "$db_id" '.d1_databases[0].database_id = $id' wrangler.jsonc > /tmp/wrangler.jsonc
          mv /tmp/wrangler.jsonc wrangler.jsonc
          echo "D1 database is ready."

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply canary-mcp-db --remote

      - name: Configure pairing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAIRING_SECRET: ${{ secrets.CANARYMCP_PAIRING_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${PAIRING_SECRET:-}" ] || [ "${#PAIRING_SECRET}" -lt 32 ]; then
            echo "Configure CANARYMCP_PAIRING_SECRET with at least 32 characters before deploying." >&2
            exit 1
          fi
          printf '%s' "$PAIRING_SECRET" | npx wrangler secret put PAIRING_SECRET

      - name: Configure webhook encryption secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          [[ "${WEBHOOK_KEY:-}" =~ ^[A-Za-z0-9_-]{43}$ ]] || { echo "Configure WEBHOOK_ENCRYPTION_KEY as a 43-character base64url secret before deploying." >&2; exit 1; }
          printf '%s' "$WEBHOOK_KEY" | npx wrangler secret put WEBHOOK_ENCRYPTION_KEY

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
