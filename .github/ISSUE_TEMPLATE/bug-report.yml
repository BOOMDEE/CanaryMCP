name: Bug report
description: Report a reproducible problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        CanaryMCP 目前尚无正式实现。提交前请确认问题来自本仓库的实际代码；不要填写密码、令牌或其他秘密。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简洁、准确地描述问题。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供可复现步骤、预期结果和实际结果。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、版本及相关运行时版本。
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 删除凭证与个人信息后再提供。
